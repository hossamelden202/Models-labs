model:
  model_id: dinov3-vits16-blood-gore-production
  source: state_dict
  num_classes: 3
  path: /kaggle/input/models/hossameldenmohamed/blood-gore-dinov3-model/pytorch/default/1/final_model.pt
  state_dict_key: model_state_dict
  factory: /kaggle/working/modellab/experiments/dinov3_gore/dinov3_classifier.py:build_model
  factory_kwargs:
    backbone_path: /kaggle/input/models/x1an9l1/facebookdinov3-vits16-pretrain-lvd1689m/transformers/default/1/facebook/dinov3-vits16-pretrain-lvd1689m
