[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modellab"
version = "0.1.0"
description = "Investigate why image classification models fail"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "numpy",
]

[project.optional-dependencies]
vision = [
    "torch",
    "torchvision",
    "pandas",
    "scikit-learn",
    "scipy",
    "pillow",
    "pyarrow",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
modellab = "modellab.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
